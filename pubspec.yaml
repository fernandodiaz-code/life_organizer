name: life_organizer_mono
description: Monorepo for Life Organizer and WetFace packages.
publish_to: none

environment:
  sdk: ^3.11.4

workspace:
  - packages/core
  - packages/life_organizer
  - packages/wetface

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.3.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      run: dart analyze .
      exec:
        concurrency: 1
      description: Analyze every package in the workspace.

    test:
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists:
          - test
      description: Run Flutter tests for packages that define test/.

    build:android:
      run: flutter build apk --debug
      exec:
        concurrency: 1
      packageFilters:
        scope:
          - life_organizer
      description: Build the Android debug APK for Life Organizer.
